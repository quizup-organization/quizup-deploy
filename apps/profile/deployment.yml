apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile
  namespace: quizup-prod
  labels:
    app: profile
spec:
  replicas: 1
  selector:
    matchLabels:
      app: profile
  template:
    metadata:
      labels:
        app: profile
    spec:
      containers:
        - name: profile
          image: ghcr.io/quizup-organization/profile:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080

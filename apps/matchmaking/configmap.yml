apiVersion: v1
kind: ConfigMap
metadata:
  name: quizup-matchmaking-config
  namespace: quizup-prod
data:
  QUIZUP_DB_HOST: postgres
  QUIZUP_DB_PORT: "5432"
  QUIZUP_DB_NAME: quizup_matchmaking
  QUIZUP_RABBITMQ_HOST: rabbitmq
  QUIZUP_RABBITMQ_PORT: "5672"
  QUIZUP_RABBITMQ_VHOST: /
  QUIZUP_AUTH_SERVER_URL: http://identity.quizup-prod.svc.cluster.local:8080
  QUIZUP_AUTH_SERVER_JWKS_URL: http://identity.quizup-prod.svc.cluster.local:8080/oauth2/jwks
  QUIZUP_LOG_LEVEL: INFO


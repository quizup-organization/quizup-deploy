apiVersion: apps/v1
kind: Deployment
metadata:
  name: matchmaking
  namespace: quizup-prod
  labels:
    app: matchmaking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matchmaking
  template:
    metadata:
      labels:
        app: matchmaking
    spec:
      containers:
        - name: matchmaking
          image: ghcr.io/quizup-organization/matchmaking:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080

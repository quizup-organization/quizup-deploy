apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  namespace: quizup-prod
  labels:
    app: identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity
  template:
    metadata:
      labels:
        app: identity
    spec:
      containers:
        - name: identity
          image: ghcr.io/quizup-organization/identity:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
